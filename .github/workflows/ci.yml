name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      # npm ci fails on Linux: package-lock.json lacks esbuild's optional platform packages.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-pack.mjs
